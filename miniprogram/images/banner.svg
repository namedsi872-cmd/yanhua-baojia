<svg xmlns="http://www.w3.org/2000/svg" width="750" height="420" viewBox="0 0 750 420">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#1a1630"/>
      <stop offset="100%" stop-color="#2a1840"/>
    </linearGradient>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd7a8" stop-opacity="1"/>
      <stop offset="35%" stop-color="#e45d43" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e45d43" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9c8" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ff8a5c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="750" height="420" fill="url(#sky)"/>
  <!-- soft city glow -->
  <ellipse cx="375" cy="400" rx="420" ry="70" fill="#3a2a55" opacity="0.55"/>
  <!-- bursts -->
  <g transform="translate(180 150)">
    <circle r="70" fill="url(#g1)"/>
    <g stroke="#ffc9a0" stroke-width="2" opacity="0.9">
      <line x1="0" y1="0" x2="0" y2="-95"/><line x1="0" y1="0" x2="67" y2="-67"/>
      <line x1="0" y1="0" x2="95" y2="0"/><line x1="0" y1="0" x2="67" y2="67"/>
      <line x1="0" y1="0" x2="0" y2="95"/><line x1="0" y1="0" x2="-67" y2="67"/>
      <line x1="0" y1="0" x2="-95" y2="0"/><line x1="0" y1="0" x2="-67" y2="-67"/>
    </g>
  </g>
  <g transform="translate(520 120)">
    <circle r="55" fill="url(#g2)"/>
    <g stroke="#ffe0c0" stroke-width="2" opacity="0.85">
      <line x1="0" y1="0" x2="0" y2="-78"/><line x1="0" y1="0" x2="55" y2="-55"/>
      <line x1="0" y1="0" x2="78" y2="0"/><line x1="0" y1="0" x2="55" y2="55"/>
      <line x1="0" y1="0" x2="0" y2="78"/><line x1="0" y1="0" x2="-55" y2="55"/>
      <line x1="0" y1="0" x2="-78" y2="0"/><line x1="0" y1="0" x2="-55" y2="-55"/>
    </g>
  </g>
  <g transform="translate(400 210)">
    <circle r="40" fill="url(#g1)" opacity="0.85"/>
  </g>
  <!-- spark dots -->
  <g fill="#ffd7a8">
    <circle cx="90" cy="80" r="2"/><circle cx="640" cy="60" r="2"/>
    <circle cx="300" cy="50" r="1.5"/><circle cx="700" cy="180" r="2"/>
    <circle cx="120" cy="220" r="1.5"/><circle cx="580" cy="260" r="2"/>
  </g>
</svg>
